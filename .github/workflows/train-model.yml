name: MLflow CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  train-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.7"

      - name: Check environment
        run: |
          python --version
          pip --version
          pwd
          ls -la

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mlflow scikit-learn pandas numpy joblib

      - name: Prepare MLflow tracking directory
        run: |
          rm -rf mlruns mlruns_ci MLProject/mlruns MLProject/mlruns_ci
          mkdir -p "${GITHUB_WORKSPACE}/mlruns_ci"
          echo "MLFLOW_TRACKING_URI=file:${GITHUB_WORKSPACE}/mlruns_ci" >> $GITHUB_ENV
          echo "MLFLOW_EXPERIMENT_NAME=Default" >> $GITHUB_ENV

      - name: Initialize MLflow experiment
        run: |
          python - <<'PY'
          import os
          import mlflow

          mlflow.set_tracking_uri(os.environ["MLFLOW_TRACKING_URI"])
          mlflow.set_experiment(os.environ.get("MLFLOW_EXPERIMENT_NAME", "Default"))

          print("Tracking URI:", mlflow.get_tracking_uri())
          print("Experiment initialized successfully")
          PY

      - name: Run MLflow project
        run: |
          mlflow run MLProject --env-manager=local

      - name: Get latest MLflow run_id
        run: |
          python - <<'PY'
          import os
          import mlflow

          mlflow.set_tracking_uri(os.environ["MLFLOW_TRACKING_URI"])

          experiments = mlflow.search_experiments()
          latest_run = None

          for exp in experiments:
              runs = mlflow.search_runs(
                  experiment_ids=[exp.experiment_id],
                  order_by=["start_time DESC"],
                  max_results=1
              )

              if not runs.empty:
                  run = runs.iloc[0]
                  if latest_run is None or run["start_time"] > latest_run["start_time"]:
                      latest_run = run

          if latest_run is not None:
              run_id = latest_run["run_id"]
              print("Latest MLflow run_id:", run_id)
              with open("latest_run_id.txt", "w") as f:
                  f.write(run_id)
          else:
              raise RuntimeError("No MLflow run found")
          PY

      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: |
            mlruns_ci
            latest_run_id.txt
            MLProject/artifacts
            MLProject/*.pkl
            MLProject/*.joblib
            MLProject/*.json
          if-no-files-found: warn
