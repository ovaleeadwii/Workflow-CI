name: MLflow CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  train-model:
    runs-on: ubuntu-latest

    steps:
      - name: Run actions/checkout@v3
        uses: actions/checkout@v3

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.7"

      - name: Check Env
        run: |
          python --version
          pip --version
          pwd
          ls -la

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mlflow scikit-learn pandas numpy joblib pydrive2

      - name: Set MLflow Tracking URI
        run: |
          echo "MLFLOW_TRACKING_URI=file:./mlruns" >> $GITHUB_ENV

      - name: Run mlflow project
        run: |
          mlflow run MLProject --env-manager=local

      - name: Get latest MLflow run_id
        run: |
          python - <<'PY'
          import os
          import mlflow

          mlflow.set_tracking_uri("file:./mlruns")

          experiments = mlflow.search_experiments()
          latest_run = None

          for exp in experiments:
              runs = mlflow.search_runs(
                  experiment_ids=[exp.experiment_id],
                  order_by=["start_time DESC"],
                  max_results=1
              )

              if not runs.empty:
                  run = runs.iloc[0]
                  if latest_run is None or run["start_time"] > latest_run["start_time"]:
                      latest_run = run

          if latest_run is not None:
              run_id = latest_run["run_id"]
              print("Latest MLflow run_id:", run_id)
              with open("latest_run_id.txt", "w") as f:
                  f.write(run_id)
          else:
              print("No MLflow run found")
          PY

      - name: Install Python dependencies
        run: |
          pip install pydrive2

      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: |
            mlruns
            MLProject/mlruns
            MLProject/artifacts
            MLProject/*.pkl
            MLProject/*.joblib
            MLProject/*.json
            latest_run_id.txt

      - name: Upload to Google Drive
        if: ${{ secrets.GDRIVE_CREDENTIALS != '' }}
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python upload_to_gdrive.py